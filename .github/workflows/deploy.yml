name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # pevenmui/（UI 部品）は submodule
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # カスタムドメインならルート、そうでなければ /<リポジトリ名> が返る
      - id: pages
        uses: actions/configure-pages@v5
      # モデルは sherpa-onnx の配布物から取る。毎回取らないようキャッシュする
      - uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run fetch-models
      # wasm はリポジトリにコミット済みのものを使う
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
